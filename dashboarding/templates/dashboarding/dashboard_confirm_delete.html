{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card border-danger shadow-sm">
        <div class="card-body">
          <h2 class="text-danger mb-3">Delete Dashboard</h2>
          <p>Are you sure you want to delete the dashboard <strong>{{ dashboard }}</strong>?</p>
          <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete</button>
            <a href="{% url 'dashboarding:dashboard_list' %}" class="btn btn-secondary ms-2">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
