name: CI

on:
  push:
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-secret-key-for-siematic-workflow-only-2026-07-28-keep-out-of-prod

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-docs.txt

      - name: Generate OpenAPI schema
        run: python manage.py spectacular --file docs/reference/openapi.yaml --settings SIEMatic.settings.web

      - name: Check environment variable reference
        run: python tools/docs/check_env_reference.py

      - name: Build documentation
        run: mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django checks
        run: python manage.py check --settings SIEMatic.settings.web

      - name: Run deploy checks with TLS enabled
        env:
          SIEMATIC_TLS_ENABLED: "True"
        run: python manage.py check --deploy --settings SIEMatic.settings.web

      - name: Collect static assets
        run: python manage.py collectstatic --no-input --settings SIEMatic.settings.web

      - name: Test documentation examples
        run: python tools/docs/test_doc_examples.py

      - name: Run tests with coverage
        run: |
          coverage run manage.py test --settings SIEMatic.settings.web
          coverage report
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg DJANGO_SECRET_KEY="${DJANGO_SECRET_KEY}" .

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

      - name: Audit docs dependencies
        run: pip-audit -r requirements-docs.txt
