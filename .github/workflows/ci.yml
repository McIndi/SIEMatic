name: CI

on:
  push:
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-secret-key-for-siematic-workflow-only-2026-07-28-keep-out-of-prod

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-docs.txt

      - name: Generate OpenAPI schema
        run: python manage.py spectacular --file docs/reference/openapi.yaml --settings SIEMatic.settings.web

      - name: Check environment variable reference
        run: python tools/docs/check_env_reference.py

      - name: Build documentation
        run: mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django checks
        run: python manage.py check --settings SIEMatic.settings.web

      - name: Run deploy checks with TLS enabled
        env:
          SIEMATIC_TLS_ENABLED: "True"
        run: python manage.py check --deploy --settings SIEMatic.settings.web

      - name: Collect static assets
        run: python manage.py collectstatic --no-input --settings SIEMatic.settings.web

      - name: Test documentation examples
        run: python tools/docs/test_doc_examples.py

      - name: Run tests with coverage
        run: |
          coverage run manage.py test --settings SIEMatic.settings.web
          coverage report
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg DJANGO_SECRET_KEY="${DJANGO_SECRET_KEY}" -t siematic:ci .

      # OpenShift runs containers as a UID from the namespace range, in group 0,
      # ignoring the image's USER. This UID is in no group inside the image, so
      # the container only starts if group 0 owns what it needs to read and
      # write. Without this check that breakage is only found on a cluster.
      - name: Start the image as an arbitrary UID
        run: |
          docker run -d --name siematic-uid-check \
            --user 1000670000:0 \
            -e DJANGO_SECRET_KEY="${DJANGO_SECRET_KEY}" \
            -e DJANGO_LOG_TO_FILE=False \
            -p 8000:8000 \
            siematic:ci

      - name: Wait for the health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz | grep -q '^ok$'; then
              echo "healthz answered after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "healthz never answered" >&2
          docker logs siematic-uid-check
          exit 1

      - name: Check the readiness endpoint
        run: curl -fsS http://127.0.0.1:8000/readyz | grep -q '^ok$'

      - name: Confirm the process is not running as root
        run: |
          uid=$(docker exec siematic-uid-check id -u)
          test "$uid" = "1000670000" || { echo "unexpected uid $uid" >&2; exit 1; }

      - name: Show container logs
        if: always()
        run: docker logs siematic-uid-check || true

      - name: Remove the container
        if: always()
        run: docker rm -f siematic-uid-check || true

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

      - name: Audit docs dependencies
        run: pip-audit -r requirements-docs.txt
