name: CI

on:
  push:
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-secret-key-not-for-production

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check --settings SIEMatic.settings.web

      - name: Run tests
        run: python manage.py test --settings SIEMatic.settings.web

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg DJANGO_SECRET_KEY="${DJANGO_SECRET_KEY}" .
