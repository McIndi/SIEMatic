name: CI

on:
  push:
  pull_request:

env:
  DJANGO_SECRET_KEY: ci-secret-key-for-siematic-workflow-only-2026-07-28-keep-out-of-prod

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install coverage

      - name: Run Django checks
        run: python manage.py check --settings SIEMatic.settings.web

      - name: Run deploy checks with TLS enabled
        env:
          SIEMATIC_TLS_ENABLED: "True"
        run: python manage.py check --deploy --settings SIEMatic.settings.web

      - name: Collect static assets
        run: python manage.py collectstatic --no-input --settings SIEMatic.settings.web

      - name: Run tests with coverage
        run: |
          coverage run manage.py test --settings SIEMatic.settings.web
          coverage report
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg DJANGO_SECRET_KEY="${DJANGO_SECRET_KEY}" .
