{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4 text-center">Login</h2>
        {% if oidc_enabled %}
            <a href="{% url 'oidc_authentication_init' %}" class="btn btn-primary w-100 mb-3">
                Sign in with {{ oidc_provider_name }}
            </a>
            <div class="text-center text-muted small mb-3">or use a local account</div>
        {% endif %}
        <form method="post" class="card p-4 shadow-sm">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn {% if oidc_enabled %}btn-outline-secondary{% else %}btn-primary{% endif %} w-100">Login</button>
        </form>
        <div class="mt-3 text-center">
            <a href="{% url 'password_reset' %}" class="link-secondary">Forgot your password?</a>
        </div>
    </div>
</div>
{% endblock %}
