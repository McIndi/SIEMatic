{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Profile{% endblock %}

{% block content %}
<h2>Your Profile</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
<p><a href="{% url 'password_reset' %}">Reset your password</a></p>
{% endblock %}
