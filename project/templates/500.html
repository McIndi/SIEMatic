<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error — SIEMatic</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; color: #212529; margin: 0; padding: 0; }
        .container { max-width: 540px; margin: 10vh auto; text-align: center; padding: 2rem; }
        h1 { font-size: 5rem; font-weight: 700; color: #adb5bd; margin: 0; }
        h2 { margin: 0.5rem 0 1rem; }
        p { color: #6c757d; margin-bottom: 1.5rem; }
        a { display: inline-block; padding: 0.5rem 1.25rem; background: #0d6efd; color: #fff;
            text-decoration: none; border-radius: 0.375rem; font-size: 0.95rem; }
        a:hover { background: #0b5ed7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>An unexpected error occurred. Please try again, or contact your administrator if the problem persists.</p>
        <a href="/">Go to Home</a>
    </div>
</body>
</html>
